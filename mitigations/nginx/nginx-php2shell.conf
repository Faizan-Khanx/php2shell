# php2shell (CVE-2026-109618 / CVE-2026-109619) - Nginx Mitigation
# UNOFFICIAL, PROVISIONAL mitigation.
# Real fix: Upgrade PHP or set `session.upload_progress.enabled = Off` in php.ini / www.conf.
#
# Blocks multipart/form-data POST/PUT/PATCH requests before they reach the PHP backend.
# Scope this to PHP scripts/locations that DO NOT accept legitimate file uploads.

# Approach 1: Block within a PHP location block
location ~ \.php$ {
    # Block requests attempting multipart on non-upload routes
    if ($http_content_type ~* "^[[:space:]]*multipart/form-data([;,[:space:]]|$)") {
        return 403;
    }

    # Standard FastCGI PHP configuration
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
